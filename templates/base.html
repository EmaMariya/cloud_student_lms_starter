<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cloud LMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .navbar-brand {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .nav-user {
            color: white;
            font-weight: 500;
        }

        .nav-link-custom {
            color: white;
            text-decoration: none;
            font-weight: 500;
            margin-left: 12px;
        }

        .nav-link-custom:hover {
            color: #dbeafe;
        }

        .page-container {
            min-height: calc(100vh - 70px);
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.07);
        }

        .btn-primary {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            border: none;
            border-radius: 9px;
            padding: 10px 22px;
            font-weight: 600;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(37, 99, 235, 0.3);
        }

        .alert {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand text-white" href="/">
                ☁ Cloud LMS
            </a>

            <div>
                {% if session.get('username') %}
                    <span class="nav-user">
                        Hi, {{ session['username'] }}
                    </span>

                    <a class="nav-link-custom" href="/logout">
                        Logout
                    </a>
                {% endif %}
            </div>

        </div>
    </nav>

    <main class="container page-container py-5">

        {% with messages = get_flashed_messages() %}
            {% for m in messages %}
                <div class="alert alert-info shadow-sm">
                    {{ m }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
